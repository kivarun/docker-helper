name: docker-helper
license: GPL-3.0-only
arch: amd64
platform: linux
version: ${VERSION}
description: Policy-enforcing Docker mediation daemon
homepage: https://github.com/kivarun/docker-helper

overrides:
  deb:
    depends:
      - systemd
      - apparmor
      # Builder identity + subordinate-ID provisioning (useradd/usermod).
      - passwd
      # Builder backend runtime (distro-owned; the pinned BuildKit payload
      # is product-shipped, rootlesskit/slirp4netns/newuidmap are not).
      - rootlesskit
      - slirp4netns
      - uidmap
    scripts:
      postinstall: packaging/scripts/deb/postinstall.sh
      preremove: packaging/scripts/deb/preremove.sh
      postremove: packaging/scripts/deb/postremove.sh
  rpm:
    depends:
      - systemd
      - apparmor-parser
      - apparmor-abstractions
      - policycoreutils
      - policycoreutils-python-utils
      # Descriptor-safe recursive workspace relabeling is delegated to upstream libselinux
      # restorecon, which is descriptor-safe against the pathname-replacement
      # TOCTOU only from the 3.11 selinux_restorecon rewrite onward (and only
      # with a real procfs, enforced at runtime). The floor is verified from
      # the built RPM metadata, not merely this source text.
      - libselinux1 >= 3.11
      # bindfs is the required passthrough projection mechanism for the
      # SELinux workload read-only exposure path.
      # The SELinux backend fails closed when the binary is missing.
      - bindfs
      # The SELinux docker_helper module requires container-selinux symbols
      # (attributes container_domain/container_net_domain, types
      # container_runtime_t/container_runtime_exec_t/container_var_run_t).
      # Without them the %post semodule link fails at the module's require
      # statements (P4-B1 diagnosis: cil:33 typeattributeset). The same
      # conditional dependency the Tumbleweed docker package itself ships
      # (bsc#1252672): only where SELinux policy is installed, never an
      # unconditional container-selinux or Docker dependency.
      - "(container-selinux if selinux-policy)"
      # Builder backend runtime on openSUSE Tumbleweed: shadow (useradd/
      # usermod AND newuidmap/newgidmap), rootlesskit, slirp4netns.
      - shadow
      - rootlesskit
      - slirp4netns
    scripts:
      postinstall: packaging/scripts/rpm/postinstall.sh
      preremove: packaging/scripts/rpm/preremove.sh
      postremove: packaging/scripts/rpm/postremove.sh

contents:
  - src: dist/docker-helper
    dst: /usr/bin/docker-helper
    file_info:
      mode: 0755

  - src: packaging/systemd/system/docker-helper.service
    dst: /usr/lib/systemd/system/docker-helper.service
    file_info:
      mode: 0644

  - src: packaging/systemd/system/docker-helper-builder.service
    dst: /usr/lib/systemd/system/docker-helper-builder.service
    file_info:
      mode: 0644

  - src: packaging/scripts/lib/provision-builder.sh
    dst: /usr/share/docker-helper/lib/provision-builder.sh
    file_info:
      mode: 0644

  # Pinned BuildKit payload (one immutable payload across every format;
  # staged by build-buildkit-payload.sh which verifies the upstream SHA-256
  # before staging). /usr/libexec/docker-helper/buildkit is the fixed
  # product prefix the builder manager resolves.
  - src: dist/buildkit/usr/libexec/docker-helper/buildkit/buildkitd
    dst: /usr/libexec/docker-helper/buildkit/buildkitd
    file_info:
      mode: 0755

  - src: dist/buildkit/usr/libexec/docker-helper/buildkit/buildctl
    dst: /usr/libexec/docker-helper/buildkit/buildctl
    file_info:
      mode: 0755

  - src: dist/buildkit/usr/libexec/docker-helper/buildkit/buildkit-runc
    dst: /usr/libexec/docker-helper/buildkit/buildkit-runc
    file_info:
      mode: 0755

  - src: dist/buildkit/usr/share/doc/docker-helper/buildkit/LICENSE
    dst: /usr/share/doc/docker-helper/buildkit/LICENSE
    file_info:
      mode: 0644

  - src: dist/buildkit/usr/share/doc/docker-helper/buildkit/MANIFEST
    dst: /usr/share/doc/docker-helper/buildkit/MANIFEST
    file_info:
      mode: 0644

  - src: packaging/apparmor/docker-helper-system
    dst: /etc/apparmor.d/docker-helper-system
    file_info:
      mode: 0644

  - src: dist/man/docker-helper.1.gz
    dst: /usr/share/man/man1/docker-helper.1.gz
    file_info:
      mode: 0644

  - src: dist/man/docker-helper-config.5.gz
    dst: /usr/share/man/man5/docker-helper-config.5.gz
    file_info:
      mode: 0644

  - src: LICENSE
    dst: /usr/share/doc/docker-helper/LICENSE
    file_info:
      mode: 0644

  - src: packaging/apparmor/local/curl
    dst: /usr/share/docker-helper/apparmor/local/curl
    file_info:
      mode: 0644

  - src: dist/docker_helper.pp
    dst: /usr/share/selinux/docker_helper.pp
    packager: rpm
    file_info:
      mode: 0644

  - src: dist/completions/docker-helper
    dst: /usr/share/bash-completion/completions/docker-helper
    file_info:
      mode: 0644
