name: docker-helper
arch: amd64
platform: linux
version: ${VERSION}
description: Policy-enforcing Docker mediation daemon
homepage: https://github.com/kivarun/docker-helper

overrides:
  deb:
    conffiles:
      - path: /etc/apparmor.d/docker-helper.d/managed-roots
  rpm:
    config_noreplace: true

contents:
  - src: dist/docker-helper
    dst: /usr/bin/docker-helper
    file_info:
      mode: 0755

  - src: packaging/systemd/system/docker-helper.service
    dst: /usr/lib/systemd/system/docker-helper.service
    file_info:
      mode: 0644

  - src: packaging/apparmor/docker-helper-system
    dst: /etc/apparmor.d/docker-helper-system
    file_info:
      mode: 0644

  - src: packaging/apparmor/docker-helper.d/managed-roots
    dst: /etc/apparmor.d/docker-helper.d/managed-roots
    file_info:
      mode: 0644
