name: UAT (black-box)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which jobs to run (full matrix or openSUSE SELinux job only)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - selinux
      uat_version:
        description: 'Version string baked into the candidate artifacts (default 2.1.0-uat)'
        required: false
        default: '2.1.0-uat'
        type: string

permissions:
  contents: read

# This workflow is a THIN CALLER of the canonical release artifact gate
# (.github/workflows/artifact-gate.yml), which OWNS the release-candidate
# producer and the full consumer matrix. There is deliberately ONE definition
# of the artifact gate; release.yml calls the SAME gate and only promotes after
# it. See artifact-gate.yml for the producer/consumer graph and the candidate
# identity / retry semantics.
#
# UAT is workflow_dispatch-only with an explicit full / selinux scope. Ordinary
# pushes to main run only CI (.github/workflows/ci.yml), and tag-triggered
# release UAT is owned solely by release.yml (the single publication path).
#
# The explicit profile set (no Cartesian product of meaningless combinations):
#
#   platform  install   MAC       runner
#   ubuntu    deb       apparmor  ubuntu-24.04                 (hosted, full)
#   ubuntu    tarball   apparmor  ubuntu-24.04                 (hosted, full)
#   ubuntu    deb       apparmor  ubuntu-24.04 regressions 3-9 (hosted, full)
#   opensuse  rpm       apparmor  ubuntu-24.04 -> QEMU/KVM Tumbleweed VM (full)
#   opensuse  rpm       selinux   ubuntu-24.04 -> QEMU/KVM Tumbleweed VM (full/selinux)
#   opensuse  tarball   selinux   ubuntu-24.04 -> QEMU/KVM Tumbleweed VM (full)
#   (scope=selinux: bounded openSUSE SELinux job only, developer diagnostic)
#
# EVERY consumer downloads the one immutable candidate set produced by the gate
# producer, resolves its artifact from the producer-owned SHA256SUMS and installs
# those exact bytes; no consumer rebuilds the package/policy/binary. The
# openSUSE profiles boot the official Tumbleweed Cloud qcow2 on a hosted
# ubuntu-24.04 runner (QEMU/KVM; see scripts/uat-vm-opensuse-apparmor.sh,
# scripts/uat-vm-opensuse-selinux.sh and
# scripts/uat-vm-opensuse-tarball-selinux.sh).

jobs:
  artifact-gate:
    uses: ./.github/workflows/artifact-gate.yml
    with:
      uat_version: ${{ inputs.uat_version }}
      scope: ${{ inputs.scope }}
