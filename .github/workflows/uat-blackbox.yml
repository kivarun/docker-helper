name: UAT (black-box)

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Which jobs to run (full matrix, bounded SELinux A/B proof, or openSUSE SELinux job only)'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - selinux-ab-proof
          - selinux
      ab_tc_proof_lnk_perms:
        description: 'Bounded trusted-CA proof only: space-separated perms to grant on docker_helper_trusted_ca_t:lnk_file in the temporary proof module (e.g. "getattr relabelfrom"); empty = pure reproduction with AVC capture'
        required: false
        default: ''
        type: string
  push:
    branches: [main]

permissions:
  contents: read

# This UAT is intentionally NOT a required check or a release gate yet: it is
# an independent workflow so it can stabilize before being promoted. See
# scripts/uat-blackbox.sh for the full coverage list and rationale.
#
# Explicit profile set (no Cartesian product of meaningless combinations).
# Each profile pins platform, artifact/install type and MAC adapter:
#
#   platform  install   MAC       runner
#   ubuntu    deb       apparmor  ubuntu-24.04                 (hosted)
#   ubuntu    tarball   apparmor  ubuntu-24.04                 (hosted)
#   opensuse  rpm       apparmor  ubuntu-24.04 -> QEMU/KVM Tumbleweed VM
#   opensuse  rpm       selinux   ubuntu-24.04 -> QEMU/KVM Tumbleweed VM
#
# Plus, on workflow_dispatch only:
#   ubuntu    deb       apparmor  ubuntu-24.04                 (hosted)
#     uat-regressions-ubuntu — Release-2 targeted regression groups 3-9 via
#     the self-contained collect-all runner
#     (scripts/uat-regressions-runner-ubuntu.sh); independent of the common
#     black-box UAT.
#
# The openSUSE/SELinux profile additionally runs the Phase-A2 docker socket
# micro-proof (scripts/uat-socket-microproof.sh) and the Release-2 SELinux
# targeted regression groups 1-4 (scripts/uat-regressions-runner-selinux.sh),
# all with collect-all semantics: a failure in one stage never prevents the
# remaining stages.
#
# The openSUSE profiles boot the official openSUSE Tumbleweed Cloud qcow2 on a
# GitHub-hosted ubuntu-24.04 runner (QEMU/KVM; see
# scripts/uat-vm-opensuse-apparmor.sh and scripts/uat-vm-opensuse-selinux.sh),
# activate the selected MAC backend (AppArmor enforcing with SELinux disabled,
# or SELinux enforcing/targeted with AppArmor inactive) and run the existing
# openSUSE black-box UAT inside the guest. The SELinux profile additionally
# runs the mount-pin / RPM postinstall regression
# (scripts/uat-selinux-mount-pin-regression.sh). Both are gated to
# workflow_dispatch so a push to main does not spin up heavy VM jobs on every
# commit; dispatch runs all profiles.
#
# openSUSE does NOT build the RPM: a hosted Ubuntu job (uat-rpm-build) builds
# the exact RPM once and uploads the RPM + its SHA-256 as a workflow artifact.
# The openSUSE job downloads the exact bytes and the expected checksum
# (produced by the build job, never recomputed-and-trusted on openSUSE) and
# hands them to the UAT as UAT_ARTIFACT_PATH / UAT_ARTIFACT_SHA256. The UAT
# verifies the exact SHA-256 before installing. Build once -> upload exact RPM
# -> VM downloads exact bytes -> install/test that RPM.
#
# Dependency installation is platform-owned: each profile runs the platform
# adapter's install-deps step before the UAT. The openSUSE install-deps step
# provisions only runtime/test/install dependencies (no musl-gcc, checkpolicy
# or other build-only tooling), because the openSUSE guest never builds.

jobs:
  # Ubuntu profiles (hosted runners) run on push and dispatch.
  uat-blackbox:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.scope == 'full')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu
            install: deb
            mac: apparmor
          - platform: ubuntu
            install: tarball
            mac: apparmor

    steps:
      - uses: actions/checkout@v7

      - name: Install platform dependencies
        run: |
          sudo -E env "PATH=$PATH" UAT_PLATFORM="${{ matrix.platform }}" \
            scripts/uat-blackbox.sh install-deps

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nFPM (pinned)
        run: |
          NFPM_VERSION=2.47.0
          NFPM_SHA256="0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"
          NFPM_TARBALL="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$NFPM_TARBALL" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${NFPM_TARBALL}"
          echo "${NFPM_SHA256}  ${NFPM_TARBALL}" | sha256sum --check -
          tar xzf "$NFPM_TARBALL" nfpm
          chmod +x nfpm
          sudo mv nfpm /usr/local/bin/
          nfpm --version | grep -qF "2.47.0"

      - name: Run black-box UAT
        run: |
          sudo -E env "PATH=$PATH" UAT_VERSION="${UAT_VERSION:-2.0.0-uat}" \
            UAT_PLATFORM="${{ matrix.platform }}" \
            UAT_INSTALL="${{ matrix.install }}" \
            UAT_MAC="${{ matrix.mac }}" scripts/uat-blackbox.sh

  # Hosted Ubuntu job that builds the RPM EXACTLY ONCE for the openSUSE UAT and
  # uploads the exact bytes + expected SHA-256 as a workflow artifact. It is
  # gated to workflow_dispatch because its only consumer is the gated openSUSE
  # job. This job carries the full build toolchain (Go, nfpm, musl-gcc,
  # checkpolicy, semodule-utils) so the openSUSE VM/guest needs none.
  uat-rpm-build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install build dependencies
        run: |
          sudo -E env "PATH=$PATH" UAT_PLATFORM=ubuntu \
            scripts/uat-blackbox.sh install-deps

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nFPM (pinned)
        run: |
          NFPM_VERSION=2.47.0
          NFPM_SHA256="0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"
          NFPM_TARBALL="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$NFPM_TARBALL" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${NFPM_TARBALL}"
          echo "${NFPM_SHA256}  ${NFPM_TARBALL}" | sha256sum --check -
          tar xzf "$NFPM_TARBALL" nfpm
          chmod +x nfpm
          sudo mv nfpm /usr/local/bin/
          nfpm --version | grep -qF "2.47.0"

      - name: Build RPM (canonical build-packages.sh)
        run: |
          ./build-packages.sh "${UAT_VERSION:-2.0.0-uat}"

      - name: Verify exactly one RPM and stage artifact + checksum
        run: |
          set -euo pipefail
          COUNT="$(ls dist/*.rpm 2>/dev/null | wc -l)"
          if [ "$COUNT" -ne 1 ]; then
            echo "error: expected exactly one dist/*.rpm, found $COUNT" >&2
            exit 1
          fi
          RPM="$(ls dist/*.rpm 2>/dev/null | head -1)"
          SHA="$(sha256sum "$RPM" | awk '{print $1}')"
          mkdir -p staging
          cp "$RPM" staging/
          printf '%s  %s\n' "$SHA" "$(basename "$RPM")" > staging/artifact.sha256
          echo "artifact: $(basename "$RPM")"
          echo "sha256:   $SHA"

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-helper-rpm
          path: staging
          if-no-files-found: error

  # Hosted Ubuntu job that runs the Release-2 targeted regression groups 3-9
  # (Ubuntu / DEB / AppArmor) through the collect-all runner
  # (scripts/uat-regressions-runner-ubuntu.sh). The runner is self-contained:
  # it builds and installs the docker-helper .deb (same build + install path as
  # the black-box UAT) and runs every regression, recording PASS/FAIL/BLOCKED
  # per group, so it does NOT depend on the common black-box UAT reaching its
  # final phase. A failure in one group never stops the others. Gated to
  # workflow_dispatch (like the RPM producer and the VM jobs).
  uat-regressions-ubuntu:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install platform dependencies
        run: |
          sudo -E env "PATH=$PATH" UAT_PLATFORM=ubuntu \
            scripts/uat-blackbox.sh install-deps

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install nFPM (pinned)
        run: |
          NFPM_VERSION=2.47.0
          NFPM_SHA256="0660ca602b2d2d2ae4781a06c692b3eeb9d437ffea05b831d76e41f4a3188783"
          NFPM_TARBALL="nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          curl -fsSL -o "$NFPM_TARBALL" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/${NFPM_TARBALL}"
          echo "${NFPM_SHA256}  ${NFPM_TARBALL}" | sha256sum --check -
          tar xzf "$NFPM_TARBALL" nfpm
          chmod +x nfpm
          sudo mv nfpm /usr/local/bin/
          nfpm --version | grep -qF "2.47.0"

      - name: Run targeted Release-2 regressions (3-9, collect-all)
        run: |
          sudo -E env "PATH=$PATH" UAT_VERSION="${UAT_VERSION:-2.0.0-uat}" \
            UAT_ALLOWED_ROOT=/home scripts/uat-regressions-runner-ubuntu.sh

  # openSUSE Tumbleweed profile: a GitHub-hosted ubuntu-24.04 runner boots the
  # official Tumbleweed Cloud VM (QEMU/KVM), switches the guest to AppArmor
  # enforcing (SELinux disabled) and runs the existing openSUSE/AppArmor
  # black-box UAT inside the guest (scripts/uat-vm-opensuse-apparmor.sh). It is
  # gated to manual dispatch (like the RPM producer) so a push never spins up a
  # heavy VM job. It consumes the RPM built by the hosted uat-rpm-build job via
  # the generic prebuilt-artifact mode (UAT_ARTIFACT_PATH / UAT_ARTIFACT_SHA256):
  # the expected SHA-256 is read from the checksum file produced by the build
  # job, never recomputed-and-trusted on openSUSE. No build toolchain (Go, nfpm,
  # musl-gcc, checkpolicy) is installed here.
  uat-blackbox-opensuse-apparmor:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'full'
    needs: uat-rpm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-helper-rpm
          path: /tmp/docker-helper-rpm

      - name: Read expected RPM checksum (from build job)
        run: |
          set -euo pipefail
          SHA="$(awk '{print $1}' /tmp/docker-helper-rpm/artifact.sha256)"
          RPM="/tmp/docker-helper-rpm/$(awk '{print $2}' /tmp/docker-helper-rpm/artifact.sha256)"
          [ -n "$SHA" ] || { echo "error: empty RPM SHA-256 from artifact" >&2; exit 1; }
          [ -f "$RPM" ] || { echo "error: downloaded RPM missing: $RPM" >&2; exit 1; }
          echo "UAT_RPM=$RPM" >> "$GITHUB_ENV"
          echo "UAT_RPM_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Run openSUSE/AppArmor black-box UAT in Tumbleweed VM
        run: |
          UAT_REPO_DIR="${{ github.workspace }}" \
          UAT_RPM="$UAT_RPM" \
          UAT_RPM_SHA256="$UAT_RPM_SHA256" \
          UAT_VERSION="${UAT_VERSION:-2.0.0-uat}" \
          scripts/uat-vm-opensuse-apparmor.sh

  # openSUSE Tumbleweed SELinux profile: a GitHub-hosted ubuntu-24.04 runner
  # boots the official Tumbleweed Cloud VM (QEMU/KVM), keeps SELinux enforcing /
  # targeted active (AppArmor inactive) and runs the existing openSUSE/SELinux
  # black-box UAT inside the guest (scripts/uat-vm-opensuse-selinux.sh),
  # followed by the SELinux mount-pin / RPM postinstall regression
  # (scripts/uat-selinux-mount-pin-regression.sh). Gated to manual dispatch
  # (like the RPM producer and the AppArmor VM job). Consumes the exact RPM
  # built by the hosted uat-rpm-build job via the generic prebuilt-artifact mode
  # (UAT_ARTIFACT_PATH / UAT_ARTIFACT_SHA256), with the expected SHA-256 read
  # from the build job's checksum file, never recomputed-and-trusted on
  # openSUSE. No build toolchain is installed here.
  uat-blackbox-opensuse-selinux:
    if: github.event_name == 'workflow_dispatch' && inputs.scope != 'selinux-ab-proof'
    needs: uat-rpm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-helper-rpm
          path: /tmp/docker-helper-rpm

      - name: Read expected RPM checksum (from build job)
        run: |
          set -euo pipefail
          SHA="$(awk '{print $1}' /tmp/docker-helper-rpm/artifact.sha256)"
          RPM="/tmp/docker-helper-rpm/$(awk '{print $2}' /tmp/docker-helper-rpm/artifact.sha256)"
          [ -n "$SHA" ] || { echo "error: empty RPM SHA-256 from artifact" >&2; exit 1; }
          [ -f "$RPM" ] || { echo "error: downloaded RPM missing: $RPM" >&2; exit 1; }
          echo "UAT_RPM=$RPM" >> "$GITHUB_ENV"
          echo "UAT_RPM_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Run openSUSE/SELinux black-box UAT in Tumbleweed VM
        run: |
          UAT_REPO_DIR="${{ github.workspace }}" \
          UAT_RPM="$UAT_RPM" \
          UAT_RPM_SHA256="$UAT_RPM_SHA256" \
          UAT_VERSION="${UAT_VERSION:-2.0.0-uat}" \
          scripts/uat-vm-opensuse-selinux.sh

  # Bounded SELinux A/B proof (scope=selinux-ab-proof): ONE enforcing Tumbleweed
  # VM that installs the RPM + confined service (install-only) and runs ONLY the
  # SELinux A/B proofs (docker runtime/socket A/B + semanage production-path
  # proof) via scripts/uat-selinux-ab-proof.sh. Evidence collection, not a gate;
  # no full matrix, no black-box scenario, no regressions.
  uat-selinux-ab-proof:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'selinux-ab-proof'
    needs: uat-rpm-build
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Download RPM artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-helper-rpm
          path: /tmp/docker-helper-rpm

      - name: Read expected RPM checksum (from build job)
        run: |
          set -euo pipefail
          SHA="$(awk '{print $1}' /tmp/docker-helper-rpm/artifact.sha256)"
          RPM="/tmp/docker-helper-rpm/$(awk '{print $2}' /tmp/docker-helper-rpm/artifact.sha256)"
          [ -n "$SHA" ] || { echo "error: empty RPM SHA-256 from artifact" >&2; exit 1; }
          [ -f "$RPM" ] || { echo "error: downloaded RPM missing: $RPM" >&2; exit 1; }
          echo "UAT_RPM=$RPM" >> "$GITHUB_ENV"
          echo "UAT_RPM_SHA256=$SHA" >> "$GITHUB_ENV"

      - name: Run bounded SELinux A/B proofs in Tumbleweed VM
        run: |
          UAT_REPO_DIR="${{ github.workspace }}" \
          UAT_RPM="$UAT_RPM" \
          UAT_RPM_SHA256="$UAT_RPM_SHA256" \
          UAT_VERSION="${UAT_VERSION:-2.0.0-uat}" \
          UAT_SELINUX_MODE=ab-proof \
          AB_TC_PROOF_LNK_PERMS="${{ inputs.ab_tc_proof_lnk_perms }}" \
          scripts/uat-vm-opensuse-selinux.sh
