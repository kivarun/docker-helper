name: Sync release to main

on:
  push:
    branches:
      - 'release/**'

concurrency:
  group: sync-release-to-main
  cancel-in-progress: false

# Least privilege: the workflow baseline is contents: read. Only the minimal
# push job requests contents: write, and it performs no repository-controlled
# test/build steps after receiving write permission.
permissions:
  contents: read

jobs:
  # validation runs repository-controlled code (gofmt, go test, go vet) with
  # contents: read only. It prepares the merge locally, validates the merged
  # tree without any remote write, and exports the exact main SHA it validated
  # against plus the exact resulting merged tree SHA.
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    outputs:
      main_sha: ${{ steps.prepare.outputs.main_sha }}
      tree_sha: ${{ steps.prepare.outputs.tree_sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch main
        run: git fetch origin main

      - name: Record validated main SHA and merged tree SHA
        id: prepare
        run: |
          git switch -C main origin/main
          main_sha="$(git rev-parse HEAD)"
          git merge --no-ff "${{ github.sha }}" \
            -m "merge release commit ${{ github.sha }}"
          tree_sha="$(git rev-parse HEAD^{tree})"
          echo "main_sha=$main_sha" >> "$GITHUB_OUTPUT"
          echo "tree_sha=$tree_sha" >> "$GITHUB_OUTPUT"

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Tests
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Whitespace errors
        run: git diff --check

  # push pins to the exact main SHA validated by the read-only job, reconstructs
  # the merge, and pushes only when the reconstructed tree SHA matches the
  # validated tree SHA. It performs only git operations (no repository-controlled
  # test/build scripts) after receiving write permission.
  merge-push:
    needs: validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Fetch main
        run: git fetch origin main

      # Fail closed if origin/main advanced after validation: pushing a merge
      # against a newer main would produce a tree the validation job never tested.
      - name: Fail closed if main advanced after validation
        run: |
          current_main="$(git rev-parse origin/main)"
          if [ "$current_main" != "${{ needs.validation.outputs.main_sha }}" ]; then
            echo "origin/main advanced after validation: expected ${{ needs.validation.outputs.main_sha }}, got $current_main" >&2
            exit 1
          fi

      # Reconstruct the merge against the exact validated main SHA and verify the
      # resulting tree is identical to the tree validation ran its checks on.
      - name: Reconstruct merge and verify tree identity
        run: |
          git switch -C main "${{ needs.validation.outputs.main_sha }}"
          git merge --no-ff "${{ github.sha }}" \
            -m "merge release commit ${{ github.sha }}"
          tree_sha="$(git rev-parse HEAD^{tree})"
          if [ "$tree_sha" != "${{ needs.validation.outputs.tree_sha }}" ]; then
            echo "reconstructed tree $tree_sha differs from validated tree ${{ needs.validation.outputs.tree_sha }}" >&2
            exit 1
          fi

      - name: Push to main
        run: git push origin main
