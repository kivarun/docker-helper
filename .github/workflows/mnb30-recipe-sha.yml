name: MNB30 loader recipe digest (throwaway)

# Throwaway diagnostic (MNB30, workflow_dispatch only, publishes nothing):
# reproduces the EXACT canonical payload-owner build recipe for the
# pinned-payload runc loader on the canonical builder environment
# (ubuntu-24.04, the pinned toolchain, no VCS stamp) and prints the
# resulting digest. This is the re-pin authority input for
# build-buildkit-payload.sh (BUILDKIT_RUNC_SHA256 / BUILDKIT_MANIFEST_SHA256);
# the pinned staging remains the single fail-closed verification owner:
# a digest accepted here is only VALIDATED by the next canonical producer
# run staging the candidate set through the payload owner.

on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  loader-recipe-digest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read the pinned recipe identities from the single owner
        run: |
          RUNC_LOADER_TAG="$(sed -n 's/^RUNC_LOADER_TAG="\([^"]*\)"/\1/p' build-buildkit-payload.sh)"
          RUNC_LOADER_SOURCE_URL="$(sed -n 's/^RUNC_LOADER_SOURCE_URL="\([^"]*\)"/\1/p' build-buildkit-payload.sh)"
          RUNC_LOADER_SOURCE_SHA256="$(sed -n 's/^RUNC_LOADER_SOURCE_SHA256="\([^"]*\)"/\1/p' build-buildkit-payload.sh)"
          RUNC_LOADER_PATCH_SHA256="$(sed -n 's/^RUNC_LOADER_PATCH_SHA256="\([^"]*\)"/\1/p' build-buildkit-payload.sh)"
          RUNC_LOADER_TOOLCHAIN="$(sed -n 's/^RUNC_LOADER_TOOLCHAIN="\([^"]*\)"/\1/p' build-buildkit-payload.sh)"
          for name in RUNC_LOADER_TAG RUNC_LOADER_SOURCE_SHA256 RUNC_LOADER_PATCH_SHA256 RUNC_LOADER_TOOLCHAIN; do
            value="${!name}"
            case "$value" in *6[0-9a-f]*) :;; esac
            [ -n "$value" ] || { echo "cannot read $name from the payload owner" >&2; exit 1; }
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          echo "RUNC_LOADER_SOURCE_URL=$RUNC_LOADER_SOURCE_URL" >> "$GITHUB_ENV"

      - name: Fetch and verify the pinned loader sources
        run: |
          work="$(mktemp -d)"
          echo "WORK=$work" >> "$GITHUB_ENV"
          curl -fsSL -o "$work/runc-loader.tar.gz" "$RUNC_LOADER_SOURCE_URL"
          echo "$RUNC_LOADER_SOURCE_SHA256  $work/runc-loader.tar.gz" | sha256sum --check -
          tar -xzf "$work/runc-loader.tar.gz" -C "$work"

      - name: Verify and apply the committed patch
        run: |
          echo "$RUNC_LOADER_PATCH_SHA256  packaging/runc-loader/runc-loader.patch" | sha256sum --check -
          patch -s -p1 -d "$WORK/runc-${RUNC_LOADER_TAG#v}" < packaging/runc-loader/runc-loader.patch

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.10'

      - name: Build through the canonical recipe and print the digest
        run: |
          cd "$WORK/runc-${RUNC_LOADER_TAG#v}"
          CGO_ENABLED=1 GOTOOLCHAIN="$RUNC_LOADER_TOOLCHAIN" \
            go build -trimpath -o "$WORK/buildkit-runc" .
          "$WORK/buildkit-runc" --version
          sha256sum "$WORK/buildkit-runc"

      - name: Print the manifest template digest input
        run: |
          printf 'RUNC_LOADER_TAG=%s\nRUNC_LOADER_SOURCE_SHA256=%s\nRUNC_LOADER_PATCH_SHA256=%s\nRUNC_LOADER_TOOLCHAIN=%s\n' \
            "$RUNC_LOADER_TAG" "$RUNC_LOADER_SOURCE_SHA256" \
            "$RUNC_LOADER_PATCH_SHA256" "$RUNC_LOADER_TOOLCHAIN"
