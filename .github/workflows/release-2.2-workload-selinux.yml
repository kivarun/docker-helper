name: Release 2.2 workload MAC SELinux live proof

on:
  workflow_dispatch:
  push:
    branches:
      - feature/2.2.6-mac-workload-projection
    paths:
      - .github/workflows/release-2.2-workload-selinux.yml
      - scripts/release-2.2-workload-selinux-vm.sh
      - workload_live_proof_test.go
      - workload_selinux.go
      - workload_mac.go
      - run_cleanup.go
      - packaging/selinux/docker-helper.te
      - packaging/selinux/docker-helper.fc
      - build-selinux-policy.sh

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate repository and SELinux policy
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck checkpolicy semodule-utils
          bash -n scripts/release-2.2-workload-selinux-vm.sh
          shellcheck scripts/release-2.2-workload-selinux-vm.sh
          scripts/check-selinux-policy.sh
          test -z "$(gofmt -l .)"
          go test ./...
          go vet ./...
          git diff --check

  selinux-live-workload-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Run production workload SELinux proof in enforcing Tumbleweed VM
        run: |
          UAT_REPO_DIR="${{ github.workspace }}" \
          WORKLOAD_EVIDENCE_DIR="$RUNNER_TEMP/release-2.2-workload-selinux-evidence" \
            scripts/release-2.2-workload-selinux-vm.sh

      - name: Upload live proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.2-workload-selinux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-2.2-workload-selinux-evidence
          if-no-files-found: error
