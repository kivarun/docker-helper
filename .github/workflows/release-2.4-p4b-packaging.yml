name: Release 2.4 P4 packaging proof

# P4 packaging: the release-candidate packages of the already-proven P4-A1
# builder composition, exercised through the package managers:
#   - one immutable pinned BuildKit v0.33.0 payload for tarball/DEB/RPM
#     (upstream SHA-256 verified by build-buildkit-payload.sh before
#     staging; identical payload checksums proven across all formats);
#   - the canonical provision-builder.sh wired into every install path
#     (executed, never re-implemented);
#   - docker-helper-builder.service packaged + the weak Wants/After
#     coupling from docker-helper.service; NNP policies preserved;
#   - install lifecycle proofs on the GENERATED packages: Ubuntu 24.04
#     (tarball install-system.sh + DEB: fresh install, idempotent
#     reinstall, failed provisioning + interrupted-install recovery,
#     upgrade from the pinned released v2.3.0 baseline) and openSUSE
#     Tumbleweed inside the official Cloud qcow2 (RPM + tarball on the
#     SELinux-enforcing host).
# P5 MAC policy, P6 daemon lifecycle, and P7 hostile-build UAT remain
# explicitly out of scope.

on:
  workflow_dispatch:
  push:
    branches:
      - p3
    paths:
      - .github/workflows/release-2.4-p4b-packaging.yml
      - build-buildkit-payload.sh
      - build-packages.sh
      - build-bundle.sh
      - scripts/release-candidate.sh
      - packaging/nfpm.yaml
      - packaging/systemd/system/docker-helper.service
      - packaging/systemd/system/docker-helper-builder.service
      - packaging/install-system.sh
      - packaging/uninstall-system.sh
      - packaging/scripts/**
      - scripts/release-2.4-p4b-*.sh
      - scripts/uat-upgrade-baseline-fixture.sh
      - scripts/test-packaging-integration.sh
      - packaging_test.go

permissions:
  contents: read

jobs:
  packaging-static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate packaging and proof scripts
        run: |
          bash -n build-buildkit-payload.sh
          bash -n build-packages.sh
          bash -n build-bundle.sh
          bash -n scripts/release-candidate.sh
          bash -n packaging/install-system.sh
          bash -n packaging/uninstall-system.sh
          sh -n packaging/scripts/deb/postinstall.sh
          sh -n packaging/scripts/deb/preremove.sh
          sh -n packaging/scripts/deb/postremove.sh
          sh -n packaging/scripts/rpm/postinstall.sh
          sh -n packaging/scripts/rpm/preremove.sh
          sh -n packaging/scripts/rpm/postremove.sh
          sh -n packaging/scripts/lib/provision-builder.sh
          bash -n scripts/release-2.4-p4b-packages-2404.sh
          bash -n scripts/release-2.4-p4b-tw.sh
          bash -n scripts/release-2.4-p4b-tw-vm.sh
          bash -n scripts/uat-upgrade-baseline-fixture.sh
          shellcheck build-buildkit-payload.sh
          shellcheck build-packages.sh
          shellcheck build-bundle.sh
          shellcheck packaging/install-system.sh
          shellcheck packaging/uninstall-system.sh
          shellcheck packaging/scripts/deb/postinstall.sh
          shellcheck packaging/scripts/deb/preremove.sh
          shellcheck packaging/scripts/deb/postremove.sh
          shellcheck packaging/scripts/rpm/postinstall.sh
          shellcheck packaging/scripts/rpm/preremove.sh
          shellcheck packaging/scripts/rpm/postremove.sh
          shellcheck packaging/scripts/lib/provision-builder.sh
          shellcheck scripts/release-2.4-p4b-packages-2404.sh
          shellcheck scripts/release-2.4-p4b-tw.sh
          shellcheck -x scripts/release-2.4-p4b-tw-vm.sh
          shellcheck scripts/uat-upgrade-baseline-fixture.sh

  packaging-build-and-go-tests:
    # Builds the shared release payload ONCE through the canonical builders,
    # runs the packaging integration Go tests in required-tool mode, then
    # stages the immutable candidate set (release-candidate.sh) for the
    # install-proof consumers.
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install packaging build toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y musl-tools checkpolicy semodule-utils rpm dpkg cpio gzip

      - name: Install pinned nFPM (single owner)
        run: |
          scripts/install-nfpm.sh

      - name: Packaging integration Go tests (required-tool mode)
        run: |
          bash scripts/test-packaging-integration.sh

      - name: Build + stage the immutable candidate set (canonical producer)
        run: |
          scripts/release-candidate.sh 2.4.0 "${{ github.sha }}"

      - name: Upload candidate set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.4-p4b-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/candidate
          if-no-files-found: error

  packages-install-2404:
    # Ubuntu 24.04: install the GENERATED candidate tarball (install-system.sh)
    # and DEB (dpkg lifecycle: fresh install, idempotent reinstall, failed
    # provisioning + interrupted-install recovery, upgrade from the pinned
    # released v2.3.0 baseline).
    needs: packaging-build-and-go-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install runner prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y apparmor uidmap rootlesskit slirp4netns curl
          sudo systemctl unmask --now docker.service docker.socket || true
          sudo systemctl start docker || true
          sudo docker version || true

      - name: Download candidate set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-2.4-p4b-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/p4b/candidate

      - name: Run the 2404 packaging install proof
        run: |
          sudo -E env "PATH=$PATH" \
            P4B_CANDIDATE_DIR=/tmp/p4b/candidate \
            P4B_EVIDENCE_DIR="$RUNNER_TEMP/release-2.4-p4b-evidence" \
            scripts/release-2.4-p4b-packages-2404.sh

      - name: Upload 2404 packaging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.4-p4b-2404-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-2.4-p4b-evidence
          if-no-files-found: error

  packages-install-tumbleweed:
    # openSUSE Tumbleweed (official Cloud qcow2, QEMU/KVM): install the
    # GENERATED candidate RPM (zypper dependency resolution) and tarball
    # (install-system.sh on the SELinux-enforcing host) with the same
    # lifecycle proofs.
    needs: packaging-build-and-go-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Download candidate set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-2.4-p4b-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/candidate

      - name: Run Tumbleweed packaging install proof
        run: |
          UAT_REPO_DIR="${{ github.workspace }}" \
          P4B_CANDIDATE_DIR="${{ github.workspace }}/dist/candidate" \
          P4B_EVIDENCE_DIR="$RUNNER_TEMP/release-2.4-p4b-tw-evidence" \
            scripts/release-2.4-p4b-tw-vm.sh

      - name: Upload Tumbleweed packaging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.4-p4b-tw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-2.4-p4b-tw-evidence
          if-no-files-found: warn
