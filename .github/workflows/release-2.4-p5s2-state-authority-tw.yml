name: Release 2.4 P5-S2 state-tree authority experiment

# One-off investigation job (P5-S2g27): with the REAL production
# composition (the real builder manager under its real systemd unit with
# the SELinuxContext binding and the active unit-cgroup boundary, the
# manager's real rootlesskit launch vehicle, and the manager RPC over
# manager.sock spoken by the harness as the daemon would), establish
# whether an operation can, through the state-tree access G26 proved
# (docker_helper_builder_state_t:s0 cross-op readable/writable), change a
# trusted production action relating to another operation — the
# confused-deputy question the G26 review left open. Measured: the
# manager's refuse-to-adopt path (a cross-op planted state object), the
# rootlesskit state-dir lock (a cross-op flock), the startup purge's ops
# name-injection (unit mode + manual legacy mode), the buildkitd
# data-root write link, and the negative invariants (no state-tree
# mkdir, the runtime tree's write denial, the .config path absence, the
# loaded TE sets for the cross-op socket surfaces). GUEST-ONLY temporary
# modules; the production module is compiled from the UNCHANGED repo
# sources and never modified; no additional SELinux grants for any
# production component; no manager changes; no state-tree relabels.

on:
  workflow_dispatch:
  push:
    branches:
      - p3
    paths:
      - .github/workflows/release-2.4-p5s2-state-authority-tw.yml
      - scripts/release-2.4-p5s2-state-authority-tw.sh
      - scripts/release-2.4-p5s2-state-authority-tw-vm.sh
      - packaging/selinux/docker-helper.te
      - packaging/selinux/docker-helper.fc
      - builder_manager.go

permissions:
  contents: read

jobs:
  state-authority-tumbleweed:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build the real docker-helper binary from the proof commit
        run: go build -o docker-helper .

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Run Tumbleweed state-tree authority experiment
        run: |
          UAT_REPO_DIR="${{ github.workspace }}" \
          STATE_AUTHORITY_EVIDENCE_DIR="$RUNNER_TEMP/release-2.4-p5s2-state-authority-evidence" \
            scripts/release-2.4-p5s2-state-authority-tw-vm.sh

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.4-p5s2-state-authority-tw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-2.4-p5s2-state-authority-evidence
          if-no-files-found: warn
