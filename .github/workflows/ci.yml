name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses:  actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Tests
        run: go test ./...

      - name: Tests (race)
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Whitespace errors
        run: git diff --check

      - name: Release pipeline helper tests
        run: bash scripts/test-release-pipeline.sh

      - name: UAT fail-closed semantics tests
        run: |
          bash scripts/test-uat-opensuse-repo.sh
          bash scripts/test-uat-regressions-aggregation.sh
          bash scripts/test-upgrade-baseline-fixture.sh

  selinux-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses:  actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: SELinux policy syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y checkpolicy semodule-utils
          scripts/check-selinux-policy.sh

  packaging-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses:  actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native build/test dependencies
        run: |
          sudo -E env "PATH=$PATH" UAT_PLATFORM=ubuntu \
            scripts/uat-blackbox.sh install-deps
          sudo apt-get install -y rpm dpkg

      - name: Install pinned nFPM (single owner)
        run: |
          scripts/install-nfpm.sh

      - name: Packaging integration tests
        run: |
          bash scripts/test-packaging-integration.sh

  x509-openssl-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses:  actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install OpenSSL
        run: |
          sudo apt-get update
          sudo apt-get install -y openssl

      - name: Print OpenSSL version
        run: openssl version

      - name: Live OpenSSL subject-hash differential
        run: |
          DOCKER_HELPER_OPENSSL_DIFFERENTIAL=1 \
            go test -run '^TestOpenSSLSubjectHashDifferential$' .

  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses:  actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Static build integration
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools checkpolicy semodule-utils
          scripts/check-static-build.sh
