name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses:  actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            printf 'Files requiring gofmt:\n%s\n' "$unformatted"
            exit 1
          fi

      - name: Tests
        run: go test ./...

      - name: Tests (race)
        run: go test -race ./...

      - name: Vet
        run: go vet ./...

      - name: Whitespace errors
        run: git diff --check

      - name: Release pipeline helper tests
        run: bash scripts/test-release-pipeline.sh

      - name: UAT fail-closed semantics tests
        run: |
          bash scripts/test-uat-opensuse-repo.sh
          bash scripts/test-uat-regressions-aggregation.sh

  selinux-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses:  actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: SELinux policy syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y checkpolicy semodule-utils
          scripts/check-selinux-policy.sh

  static-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses:  actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Static build integration
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools checkpolicy semodule-utils
          scripts/check-static-build.sh
