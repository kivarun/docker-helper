name: Release 2.4 R7 full-gate corrective diagnosis

# Investigation workflow (R7, workflow_dispatch only, never publishes):
# reproduces the failed full artifact-gate UAT failures on the EXACT candidate
# bytes the failed run produced (cross-run artifact download; no rebuild) and
# captures the evidence the gate's UAT diagnostics did not:
#
#   ubuntu-tarball — R7-C Ubuntu builder START refusal + the R7-B dependency
#                    differential (skip vs install of the packaged runtime
#                    dependency contract) on the hosted runner;
#   selinux-vm     — R7-A the buildctl execution denial with the packaged
#                    labels / live AVC records / differential sesearch proof,
#                    plus the R7-D child-lifecycle records, on a disposable
#                    ENFORCING Tumbleweed VM (RPM);
#   selinux-vm     — mode=mnb36 instead runs the R7 MNB36 live CIL
#                    constraint-integration gate on the same enforcing
#                    SELinux consumer: the guest's policy identity and
#                    module store, the installed candidate CIL module
#                    (docker-helper-fifo-rw-constraint at priority 400,
#                    identity-verified), the live four-cell FIFO kernel
#                    decision matrix (own ALLOW / cross DENY under the
#                    active constraint, baseline and constrained), the
#                    fd:use / open / TE invariance checks, the MNB33
#                    producing-RUN flow with the constraint active, and
#                    the verified rollback (module removal, constraint
#                    restoration, policy-sha closure, release .pp
#                    unchanged). ONE controlled experiment: the CIL
#                    module is removed on every path; NO permanent RPM
#                    change, NO Release-GO UAT.
#   apparmor-vm    — R7-C the Tumbleweed AppArmor builder START refusal with
#                    the builder service journal and the AppArmor launch
#                    vehicle prerequisites (distro rootlesskit profile, userns
#                    restriction), on a disposable Tumbleweed VM (RPM);
#                    mode=stop-proof instead runs the R7 STOP-isolation proof
#                    on the same AppArmor consumer: the full process-tree
#                    capture (PID/PPID/PGID/SID/exe/cgroup) of a live
#                    `RUN sleep 300` build, the graceful-cancel and the
#                    emergency-STOP teardowns, the whole-tree survivor scan
#                    at the terminal moment (the false-STOP-OK proof), the
#                    runtime/state dir + mount residue checks and the
#                    post-teardown admission build.
#   selinux-vm     — mode=mcs-audit instead runs the R7 MCS-isolation audit
#                    on the same enforcing SELinux consumer: the loaded
#                    policy's constraint expressions verbatim (file, dir,
#                    lnk_file, sock_file, process, unix_stream_socket,
#                    fifo_file, filesystem), the mcs_constrained_type and
#                    trusted-subject membership facts for every docker-helper
#                    domain and object type, the per-class MCS-form verdict
#                    (t1/t2/unconditional), the live cross-category probe
#                    attempt in the ACTUAL docker_helper_buildkitd_t:s0:c1
#                    domain (positive/negative controls with DAC equalized,
#                    BLOCKED — never PASS — when no test process can be
#                    created), and the cgroup-finding forensics (the ordered
#                    denial set, the RUNNING buildkitd's mount-namespace
#                    mountinfo, the bundled runc version). The kernel-
#                    decision matrix (a disposable libselinux helper using
#                    security_compute_av_raw with class/permission NAMES)
#                    decides the same-category/cross-category pairs on the
#                    loaded policy for file read/write/append, dir
#                    search/write/add_name/remove_name, lnk_file read,
#                    sock_file getattr and unix_stream_socket connectto —
#                    with the socket surface captured separately (the
#                    loaded unix_stream_socket class has no mlsconstrain)
#                    and never extrapolated from the file/dir proof.
#                    Security proof only: NO grants, NO production changes.
#
#   selinux-vm     — mode=exeseal instead runs the R7 exeseal boundary probe
#                    on the same enforcing SELinux consumer: the strace -f
#                    real-path trace of the bundled buildkit-runc's
#                    CloneSelfExe (sealedOverlayfs fsopen/fsconfig/fsmount
#                    sequence with per-step errno, then the memfd
#                    create/copy/seal sequence) in the actual
#                    docker_helper_buildkitd_t:s0:c1 domain, the runc
#                    process context/capabilities/namespace inventory, the
#                    build-window AVC records, a guest-built source-faithful
#                    C probe (the same syscall sequences as unconfined root
#                    = kernel-side baselines, inside a fresh unprivileged
#                    user namespace, and the memfd-vs-pathname labeling
#                    differential under an s0:c1-level subject), and the
#                    loaded policy's memfd_class policycap / tmpfs_t
#                    authority inventory. Forensic evidence only: NO grants,
#                    NO production changes, NO policy module loads.
#
# SCOPE NOTE: the default artifact source is the FAILED full-gate run's
# producer set (the RED fixture). It exists to reproduce and to collect
# forensic evidence on the exact bytes that failed; it is NOT a
# green-candidate confirmation instrument and must not be used to
# validate fixes landed at a later SHA (those are validated by the
# uat-blackbox workflow at that SHA).
# The three jobs consume the SAME producer artifact set; every guest verifies
# the artifact SHA-256 before install. The scripts live under scripts/ and are
# the only new mechanism; no production, MAC policy or UAT consumer behavior
# is changed by this workflow.

on:
  # Push-scoped to the R7 corrective branch only: workflow_dispatch cannot
  # dispatch a workflow that was never registered on the default branch, and
  # the red-before / green-after diagnosis must run on the corrective SHA
  # without touching main. The pinned inputs are the failed full-gate run
  # whose candidate set the diagnosis consumes.
  push:
    branches:
      - r7-full-gate-corrective
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Run id whose producer artifact set is diagnosed (the failed full-gate run)'
        required: true
        type: string
      artifact_name:
        description: 'Candidate artifact name (docker-helper-candidate-<run_id>-<attempt>)'
        required: true
        type: string
      mode:
        description: 'diag = the R7 red/green diagnosis; stop-proof = the R7 STOP-isolation proof (AppArmor consumer only); mcs-audit = the R7 MCS-isolation audit (SELinux consumer only); exeseal = the R7 exeseal boundary probe (SELinux consumer only); bprime = the R7 B′ isolated memfd type-transition proof (SELinux consumer only); p21a = the R7 P21-A memfd transition-scope investigation (SELinux consumer only); p21b = the R7 P21-B devnode-type acceptance evidence (SELinux consumer only); p21c = the R7 P21-C devnode open-completion rung acceptance evidence (SELinux consumer only); p21d = the R7 P21-D devnode bind-mount mounton rung acceptance evidence with pid-proof attribution and the concurrent-operations negative scenario (SELinux consumer only); p21e = the R7 P21-E OBL-8 live config.json specimen capture with a read-only inotify poller (SELinux consumer only); p21e3 = the R7 P21-E-R4-P3-P3 first enforcing wrapper integration measurement with the fresh candidate RPM (SELinux consumer only); p21e3probe = the R7 MNB12 read-only baseline live-window probe through the same p21e3 guest (no diag module, no build; SELinux consumer only); p21e3proc-sys = the R7 MNB14 read-only /proc/sys preflight (genfscon, label, mountinfo in builder/init views; no diag module, no build; SELinux consumer only); p21e3proc-file = the R7 MNB15 read-only /proc/sysrq-trigger + procfs sysctl_t coverage preflight (genfscon, policy capabilities, labels/mount IDs in available views; no diag module, no build, metadata only; SELinux consumer only); p21e3proc-keys = the R7 MNB18 read-only /proc/keys dedicated-type policy/label analysis (genfscon, proc_t attributes, direct vs attribute allow rules, representation matrix; no diag module, no build, no relabel; SELinux consumer only); p21e3diag-keys = the R7 MNB22 measurement: the seven reviewed rows plus the temporary dedicated-type CIL module (proc_keys_t:file getattr and mounton, proc_timer_list_t:file getattr and mounton), loaded before the build creates fresh procfs instances, one bounded enforcing build with OCI path inventory, verified unload (SELinux consumer only); mnb30 = the R7 MNB30 FIRST TRACER-FREE transition round (no ptrace at any boundary): the /proc sampler + the audit window with the extracted-RPM runtime pin, the four loader checks + create probe on the extracted binary, and the seinfo --role_types calibration as the preflight hard gates; the build runs under the temporary three-rule cap module only (MNB24/26/27, unload verified); the transition + cross-op rootfs-denial verdicts come from the live sampler contexts (composed workload domain + category, Cap*, NoNewPrivs) and the libselinux kernel-decision matrix (SELinux consumer only); mnb33 = the R7 MNB33 W7-stdout/stderr-channel round (SELinux consumer only): the unchanged pins plus the measured diagnostic permission set including P5, with exactly the proposed W7 FIFO permissions as a separate named temporary module (workload -> buildkitd_t: fifo_file { read write }); a real producing RUN step whose stdout and stderr carry distinct known tokens must arrive intact in the operation event stream (the harness fails on a missing token), the image export must complete, the workload context / FIFO labels / audit window are captured, the kernel decisions for workload c1 versus buildkitd FIFO objects in c1 and c2 are queried with the loaded fifo_file constraint recorded verbatim, and the cross-category fd-use probe is recorded as a GAP when no fd channel exists; unload-verified closure; mnb32 = the R7 MNB32 policy-breadth and syscall-boundary review: the S1 bin_t scope inventory (labels + consumer domains), the P5 /proc label/mode/DAC inventory, the extended kernel-decision matrix (lock/ioctl/setattr/mmap/open-read rows, own and cross category), a temporary dedicated-rolecheck-type demonstration module (load, matrix, verified unload), and one bounded enforcing build under the MNB31 Tier-A rows minus the proc_t read/open rows (the P5 counterfactual) with a guest-compiled static syscall-ladder probe as the composed workload; no permanent policy change, no relabel, no permissive domain; mnb39 = the R7 MNB39 no-exec wrapper policy verification feasibility round (SELinux consumer only): both wrapper admission-gate checks measured IN-PROCESS under docker_helper_buildkitd_t without spawning any external executable — (1) the kernel-native security_check_context interface against the exact composed workload context with the behavior matrix (valid/unknown-type/unauthorized-role/bad-category/unavailable interface) and the roletype relation rendered from the probe own loaded-policy parse compared against seinfo, (2) an in-process parse of the loaded binary policy rendering the exact fifo_file constraint statements against the canonical pinned statement and the seinfo reference; separately removable diagnostic modules only (stage 1 parse-only face set, stage 2 adds the single security:check_context row), full unload verification (policy sha restored, deny-again proof); no permanent policy integration, no product code change; mnb38 = the MNB38 RPM lifecycle UAT on the enforcing SELinux consumer (the dedicated release-2.4-mnb38-guest.sh): candidate/metadata preflight (conditional bzip2/setools-console lifecycle deps), fresh-install identity gates, repeated install/upgrade with an UNCHANGED store blob (no absent-constraint window), a controlled constraint-install failure with the centralized verified stop and no automatic restart, recovery with explicit activation and MainPID proof, and a final erase removing only the product-owned modules; mnb40b = the MNB40b admission-boundary trace + the minimal authority proof (SELinux consumer only): the S0 face trace records the RUN-op path (the system docker engine; no wrapper) against the BUILD-op path with process-identity samples; M1 removes each of the five previously unproven faces independently (exact AVC/{perm} attributions, wrapper decisions, per-arm policy SHAs); M2 enumerates the write-bit authority surface on security_t; M3 validates the combined minimal set through both faces; verified unload, byte-exact restore, deny-again; no permanent policy integration, no Release-GO UAT; mnb40a = the MNB40a production wrapper evidence reconciliation (SELinux consumer only): the MNB40 candidate binary verified through the REAL managed-run chain on the enforcing guest with a staged, separately-removable permission ladder — S0 no selinuxfs faces (the context-validation gate refuses closed, typed pre-commit); S1 + security_t dir search + file {getattr open read write} (the denial moves to security:check_context at the write); S2 + check_context (the FIFO gate refuses with all file faces present: the security read_policy denial at the policy OPEN — read_policy NOT inferable unnecessary from an ordinary file open/read); S3 + read_policy (both gates pass; positive run admission; same-snapshot seinfo parity capture, present case); S4 the constraint module removed (seinfo absent-side parity + the exact remediation refusal + byte-exact restore from the packaged artifact + re-admission); full unload verification, policy sha restored, deny-again refused closed; mnb40a only; no permanent policy integration, no Release-GO UAT; packaging lifecycle only'
        required: false
        type: string
        default: 'diag'

env:
  R7_FAILED_RUN_ID: '38944346311'
  R7_FAILED_ARTIFACT: 'docker-helper-candidate-38944346311-1'

permissions:
  contents: read
  actions: read

jobs:
  ubuntu-tarball-diag:
    if: inputs.mode != 'stop-proof' && inputs.mode != 'mcs-audit' && inputs.mode != 'exeseal' && inputs.mode != 'bprime' && inputs.mode != 'p21a' && inputs.mode != 'p21b' && inputs.mode != 'p21c' && inputs.mode != 'p21d' && inputs.mode != 'p21e' && inputs.mode != 'p21e3' && inputs.mode != 'p21e3probe' && inputs.mode != 'p21e3proc-sys' && inputs.mode != 'p21e3proc-file' && inputs.mode != 'p21e3proc-keys' && inputs.mode != 'p21e3diag-keys' && inputs.mode != 'mnb30' && inputs.mode != 'mnb32' && inputs.mode != 'mnb33' && inputs.mode != 'mnb36' && inputs.mode != 'mnb38' && inputs.mode != 'mnb39' && inputs.mode != 'mnb40a' && inputs.mode != 'mnb40b'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the exact candidate set from the failed run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name || env.R7_FAILED_ARTIFACT }}
          run-id: ${{ inputs.artifact_run_id || env.R7_FAILED_RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/candidate

      - name: Resolve exact candidate tarball from producer SHA256SUMS
        run: |
          read -r path sha < <(scripts/release-candidate-artifact.sh /tmp/candidate tar)
          echo "UAT_TARBALL=$path" >> "$GITHUB_ENV"
          echo "UAT_TARBALL_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Run the Ubuntu R7 diagnosis (red + dependency differential)
        run: |
          UAT_TARBALL="$UAT_TARBALL" \
          UAT_TARBALL_SHA256="$UAT_TARBALL_SHA256" \
            scripts/release-2.4-r7-diag-ubuntu.sh

      - name: Upload R7 Ubuntu evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.4-r7-diag-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/release-2.4-r7-diag-ubuntu-evidence
          if-no-files-found: error

  selinux-vm-diag:
    if: inputs.mode != 'stop-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Download the exact candidate set from the failed run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name || env.R7_FAILED_ARTIFACT }}
          run-id: ${{ inputs.artifact_run_id || env.R7_FAILED_RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/candidate

      - name: Resolve exact candidate RPM from producer SHA256SUMS
        run: |
          read -r path sha < <(scripts/release-candidate-artifact.sh /tmp/candidate rpm)
          echo "UAT_RPM=$path" >> "$GITHUB_ENV"
          echo "UAT_RPM_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Run the SELinux Tumbleweed VM diagnosis (R7-A/R7-C/R7-D) / MCS audit
        run: |
          UAT_REPO_DIR="${{ github.workspace }}" \
          UAT_RPM="$UAT_RPM" \
          UAT_RPM_SHA256="$UAT_RPM_SHA256" \
          R7_MODE="${{ inputs.mode || 'diag' }}" \
            scripts/release-2.4-r7-diag-tw-selinux-vm.sh

      - name: Upload R7 SELinux VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.4-r7-diag-selinux-vm-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/release-2.4-r7-diag-selinux-evidence
          if-no-files-found: error

  apparmor-vm-diag:
    if: inputs.mode != 'stop-proof' && inputs.mode != 'mcs-audit' && inputs.mode != 'exeseal' && inputs.mode != 'bprime' && inputs.mode != 'p21a' && inputs.mode != 'p21b' && inputs.mode != 'p21c' && inputs.mode != 'p21d' && inputs.mode != 'p21e' && inputs.mode != 'p21e3' && inputs.mode != 'p21e3probe' && inputs.mode != 'p21e3proc-sys' && inputs.mode != 'p21e3proc-file' && inputs.mode != 'p21e3proc-keys' && inputs.mode != 'p21e3diag-keys' && inputs.mode != 'mnb30' && inputs.mode != 'mnb32' && inputs.mode != 'mnb33' && inputs.mode != 'mnb36' && inputs.mode != 'mnb38' && inputs.mode != 'mnb39' && inputs.mode != 'mnb40a' && inputs.mode != 'mnb40b'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Download the exact candidate set from the failed run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name || env.R7_FAILED_ARTIFACT }}
          run-id: ${{ inputs.artifact_run_id || env.R7_FAILED_RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/candidate

      - name: Resolve exact candidate RPM from producer SHA256SUMS
        run: |
          read -r path sha < <(scripts/release-candidate-artifact.sh /tmp/candidate rpm)
          echo "UAT_RPM=$path" >> "$GITHUB_ENV"
          echo "UAT_RPM_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Run the AppArmor Tumbleweed VM diagnosis (R7-C) / STOP-isolation proof
        run: |
          UAT_REPO_DIR="${{ github.workspace }}" \
          UAT_RPM="$UAT_RPM" \
          UAT_RPM_SHA256="$UAT_RPM_SHA256" \
          R7_MODE="${{ inputs.mode || 'diag' }}" \
            scripts/release-2.4-r7-diag-tw-apparmor-vm.sh

      - name: Upload R7 AppArmor VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.4-r7-diag-apparmor-vm-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/release-2.4-r7-diag-apparmor-evidence
          if-no-files-found: error
