name: Release 2.4 R7 full-gate corrective diagnosis

# Investigation workflow (R7, workflow_dispatch only, never publishes):
# reproduces the failed full artifact-gate UAT failures on the EXACT candidate
# bytes the failed run produced (cross-run artifact download; no rebuild) and
# captures the evidence the gate's UAT diagnostics did not:
#
#   ubuntu-tarball — R7-C Ubuntu builder START refusal + the R7-B dependency
#                    differential (skip vs install of the packaged runtime
#                    dependency contract) on the hosted runner;
#   selinux-vm     — R7-A the buildctl execution denial with the packaged
#                    labels / live AVC records / differential sesearch proof,
#                    plus the R7-D child-lifecycle records, on a disposable
#                    ENFORCING Tumbleweed VM (RPM);
#   apparmor-vm    — R7-C the Tumbleweed AppArmor builder START refusal with
#                    the builder service journal and the AppArmor launch
#                    vehicle prerequisites (distro rootlesskit profile, userns
#                    restriction), on a disposable Tumbleweed VM (RPM);
#                    mode=stop-proof instead runs the R7 STOP-isolation proof
#                    on the same AppArmor consumer: the full process-tree
#                    capture (PID/PPID/PGID/SID/exe/cgroup) of a live
#                    `RUN sleep 300` build, the graceful-cancel and the
#                    emergency-STOP teardowns, the whole-tree survivor scan
#                    at the terminal moment (the false-STOP-OK proof), the
#                    runtime/state dir + mount residue checks and the
#                    post-teardown admission build.
#   selinux-vm     — mode=mcs-audit instead runs the R7 MCS-isolation audit
#                    on the same enforcing SELinux consumer: the loaded
#                    policy's constraint expressions verbatim (file, dir,
#                    lnk_file, sock_file, process, unix_stream_socket,
#                    fifo_file, filesystem), the mcs_constrained_type and
#                    trusted-subject membership facts for every docker-helper
#                    domain and object type, the per-class MCS-form verdict
#                    (t1/t2/unconditional), the live cross-category probe
#                    attempt in the ACTUAL docker_helper_buildkitd_t:s0:c1
#                    domain (positive/negative controls with DAC equalized,
#                    BLOCKED — never PASS — when no test process can be
#                    created), and the cgroup-finding forensics (the ordered
#                    denial set, the RUNNING buildkitd's mount-namespace
#                    mountinfo, the bundled runc version). The kernel-
#                    decision matrix (a disposable libselinux helper using
#                    security_compute_av_raw with class/permission NAMES)
#                    decides the same-category/cross-category pairs on the
#                    loaded policy for file read/write/append, dir
#                    search/write/add_name/remove_name, lnk_file read,
#                    sock_file getattr and unix_stream_socket connectto —
#                    with the socket surface captured separately (the
#                    loaded unix_stream_socket class has no mlsconstrain)
#                    and never extrapolated from the file/dir proof.
#                    Security proof only: NO grants, NO production changes.
#
#   selinux-vm     — mode=exeseal instead runs the R7 exeseal boundary probe
#                    on the same enforcing SELinux consumer: the strace -f
#                    real-path trace of the bundled buildkit-runc's
#                    CloneSelfExe (sealedOverlayfs fsopen/fsconfig/fsmount
#                    sequence with per-step errno, then the memfd
#                    create/copy/seal sequence) in the actual
#                    docker_helper_buildkitd_t:s0:c1 domain, the runc
#                    process context/capabilities/namespace inventory, the
#                    build-window AVC records, a guest-built source-faithful
#                    C probe (the same syscall sequences as unconfined root
#                    = kernel-side baselines, inside a fresh unprivileged
#                    user namespace, and the memfd-vs-pathname labeling
#                    differential under an s0:c1-level subject), and the
#                    loaded policy's memfd_class policycap / tmpfs_t
#                    authority inventory. Forensic evidence only: NO grants,
#                    NO production changes, NO policy module loads.
#
# SCOPE NOTE: the default artifact source is the FAILED full-gate run's
# producer set (the RED fixture). It exists to reproduce and to collect
# forensic evidence on the exact bytes that failed; it is NOT a
# green-candidate confirmation instrument and must not be used to
# validate fixes landed at a later SHA (those are validated by the
# uat-blackbox workflow at that SHA).
# The three jobs consume the SAME producer artifact set; every guest verifies
# the artifact SHA-256 before install. The scripts live under scripts/ and are
# the only new mechanism; no production, MAC policy or UAT consumer behavior
# is changed by this workflow.

on:
  # Push-scoped to the R7 corrective branch only: workflow_dispatch cannot
  # dispatch a workflow that was never registered on the default branch, and
  # the red-before / green-after diagnosis must run on the corrective SHA
  # without touching main. The pinned inputs are the failed full-gate run
  # whose candidate set the diagnosis consumes.
  push:
    branches:
      - r7-full-gate-corrective
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: 'Run id whose producer artifact set is diagnosed (the failed full-gate run)'
        required: true
        type: string
      artifact_name:
        description: 'Candidate artifact name (docker-helper-candidate-<run_id>-<attempt>)'
        required: true
        type: string
      mode:
        description: 'diag = the R7 red/green diagnosis; stop-proof = the R7 STOP-isolation proof (AppArmor consumer only); mcs-audit = the R7 MCS-isolation audit (SELinux consumer only); exeseal = the R7 exeseal boundary probe (SELinux consumer only); bprime = the R7 B′ isolated memfd type-transition proof (SELinux consumer only)'
        required: false
        type: string
        default: 'diag'

env:
  R7_FAILED_RUN_ID: '38944346311'
  R7_FAILED_ARTIFACT: 'docker-helper-candidate-38944346311-1'

permissions:
  contents: read
  actions: read

jobs:
  ubuntu-tarball-diag:
    if: inputs.mode != 'stop-proof' && inputs.mode != 'mcs-audit' && inputs.mode != 'exeseal' && inputs.mode != 'bprime'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download the exact candidate set from the failed run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name || env.R7_FAILED_ARTIFACT }}
          run-id: ${{ inputs.artifact_run_id || env.R7_FAILED_RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/candidate

      - name: Resolve exact candidate tarball from producer SHA256SUMS
        run: |
          read -r path sha < <(scripts/release-candidate-artifact.sh /tmp/candidate tar)
          echo "UAT_TARBALL=$path" >> "$GITHUB_ENV"
          echo "UAT_TARBALL_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Run the Ubuntu R7 diagnosis (red + dependency differential)
        run: |
          UAT_TARBALL="$UAT_TARBALL" \
          UAT_TARBALL_SHA256="$UAT_TARBALL_SHA256" \
            scripts/release-2.4-r7-diag-ubuntu.sh

      - name: Upload R7 Ubuntu evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.4-r7-diag-ubuntu-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/release-2.4-r7-diag-ubuntu-evidence
          if-no-files-found: error

  selinux-vm-diag:
    if: inputs.mode != 'stop-proof'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Download the exact candidate set from the failed run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name || env.R7_FAILED_ARTIFACT }}
          run-id: ${{ inputs.artifact_run_id || env.R7_FAILED_RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/candidate

      - name: Resolve exact candidate RPM from producer SHA256SUMS
        run: |
          read -r path sha < <(scripts/release-candidate-artifact.sh /tmp/candidate rpm)
          echo "UAT_RPM=$path" >> "$GITHUB_ENV"
          echo "UAT_RPM_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Run the SELinux Tumbleweed VM diagnosis (R7-A/R7-C/R7-D) / MCS audit
        run: |
          UAT_REPO_DIR="${{ github.workspace }}" \
          UAT_RPM="$UAT_RPM" \
          UAT_RPM_SHA256="$UAT_RPM_SHA256" \
          R7_MODE="${{ inputs.mode || 'diag' }}" \
            scripts/release-2.4-r7-diag-tw-selinux-vm.sh

      - name: Upload R7 SELinux VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.4-r7-diag-selinux-vm-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/release-2.4-r7-diag-selinux-evidence
          if-no-files-found: error

  apparmor-vm-diag:
    if: inputs.mode != 'stop-proof' && inputs.mode != 'mcs-audit' && inputs.mode != 'exeseal' && inputs.mode != 'bprime'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Download the exact candidate set from the failed run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact_name || env.R7_FAILED_ARTIFACT }}
          run-id: ${{ inputs.artifact_run_id || env.R7_FAILED_RUN_ID }}
          github-token: ${{ github.token }}
          path: /tmp/candidate

      - name: Resolve exact candidate RPM from producer SHA256SUMS
        run: |
          read -r path sha < <(scripts/release-candidate-artifact.sh /tmp/candidate rpm)
          echo "UAT_RPM=$path" >> "$GITHUB_ENV"
          echo "UAT_RPM_SHA256=$sha" >> "$GITHUB_ENV"

      - name: Run the AppArmor Tumbleweed VM diagnosis (R7-C) / STOP-isolation proof
        run: |
          UAT_REPO_DIR="${{ github.workspace }}" \
          UAT_RPM="$UAT_RPM" \
          UAT_RPM_SHA256="$UAT_RPM_SHA256" \
          R7_MODE="${{ inputs.mode || 'diag' }}" \
            scripts/release-2.4-r7-diag-tw-apparmor-vm.sh

      - name: Upload R7 AppArmor VM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.4-r7-diag-apparmor-vm-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/release-2.4-r7-diag-apparmor-evidence
          if-no-files-found: error
