name: M0 namespace diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: userns mechanics as root and as builder
        run: |
          set -x
          cat /proc/sys/user/max_user_namespaces
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          unshare --user --map-root-user true && echo ROOT_UNSHARE_OK || echo ROOT_UNSHARE_FAIL
          sudo apt-get update -y >/dev/null
          sudo apt-get install -y uidmap >/dev/null
          sudo useradd -m -s /usr/sbin/nologin dhm0builder || true
          sudo sh -c 'echo "dhm0builder:231072:65536" >> /etc/subuid; echo "dhm0builder:231072:65536" >> /etc/subgid'
          sudo -u dhm0builder sh -c 'unshare --user --map-root-user id && echo BUILDER_UNSHARE_OK' || echo BUILDER_UNSHARE_FAIL
          echo "--- single-id mapping as builder ---"
          sudo -u dhm0builder sh -c 'unshare --user --map-user 0 id && echo MAPUSER_OK' || echo MAPUSER_FAIL
          echo "--- rootlesskit net=none as runner ---"
          sudo apt-get install -y curl >/dev/null
          ROOTLESSKIT_VERSION=v3.2.0
          curl -fsSL -o /tmp/rootlesskit.tgz "https://github.com/rootless-containers/rootlesskit/releases/download/${ROOTLESSKIT_VERSION}/rootlesskit-x86_64.tar.gz"
          sudo tar -xzf /tmp/rootlesskit.tgz -C /usr/local/bin
          rootlesskit --net=none true && echo RK_RUNNER_NONE_OK || echo RK_RUNNER_NONE_FAIL
