name: One-shot v2.3.0 release notes refresh

on:
  push:
    branches:
      - release/2.3

permissions:
  contents: write

jobs:
  refresh:
    if: ${{ github.event.head_commit.message == 'ops: refresh v2.3.0 release notes' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Replace v2.3.0 release notes from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/v2.3.0-notes.md"
          awk '
            /^## \[2\.3\.0\]/ { capture=1; next }
            capture && /^## \[/ { exit }
            capture { print }
          ' CHANGELOG.md > "$notes"
          test -s "$notes"
          gh release edit v2.3.0 --notes-file "$notes"
