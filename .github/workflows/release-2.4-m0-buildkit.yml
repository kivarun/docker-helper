  m1-ephemeral-proof:
    # M1 part 2: throwaway builder-manager prototype + per-build-operation
    # ephemeral rootless BuildKit instances (candidate C mechanics).
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
