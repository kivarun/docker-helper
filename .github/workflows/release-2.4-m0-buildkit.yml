          rootlesskit --net=none true && echo RK_RUNNER_NONE_OK || echo RK_RUNNER_NONE_FAIL
          sudo -u dhm0builder rootlesskit --net=none true && echo RK_BUILDER_NONE_OK || echo RK_BUILDER_NONE_FAIL

      - name: Run rootless BuildKit M0 probe
        run: |
          sudo -E env "PATH=$PATH" M0_EVIDENCE_DIR="$RUNNER_TEMP/release-2.4-m0-evidence-2604" \
            scripts/release-2.4-m0-buildkit-proof.sh

      - name: Upload M0 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.4-m0-buildkit-2604-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-2.4-m0-evidence-2604
          if-no-files-found: error


  tumbleweed-rootless-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Run Tumbleweed M0 probe
        run: |
          UAT_REPO_DIR="${{ github.workspace }}" \
          M0_EVIDENCE_DIR="$RUNNER_TEMP/release-2.4-m0-tw-evidence" \
            scripts/release-2.4-m0-buildkit-tw-vm.sh

      - name: Upload Tumbleweed M0 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.4-m0-buildkit-tw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-2.4-m0-tw-evidence
          if-no-files-found: warn

  m1-global-daemon-proof:
    # M1 part 1: shared persistent buildkitd cross-build cache isolation
    # evidence on the hosted runners. Reuses the M0 environment setup.
    runs-on: ubuntu-24.04
    timeout-minutes: 30

