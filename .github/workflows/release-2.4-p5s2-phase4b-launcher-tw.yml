name: Release 2.4 P5-S2 Phase 4B live launcher/provisioning proof

# One-off investigation job (Phase 4B): the live Tumbleweed proof of the
# Phase 3 categorized provisioning and the Phase 4A launcher self-reexec
# chain under the SHIPPED policy, on the clean production composition (the
# binary, the module 1.2, the unit, and the provisioning script built from
# the tested proof commit; rootlesskit + the pinned bundled buildkitd). No
# guest allow-module, no policy or code change; a pre-boundary launcher
# blocker or a denied provisioning relabel is recorded and the phase
# stops. The Release GO stays closed.

on:
  workflow_dispatch:
  push:
    branches:
      - p3
    paths:
      - .github/workflows/release-2.4-p5s2-phase4b-launcher-tw.yml
      - scripts/release-2.4-p5s2-phase4b-launcher-tw.sh
      - scripts/release-2.4-p5s2-phase4b-launcher-tw-vm.sh

permissions:
  contents: read

jobs:
  phase4b-launcher-tumbleweed:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the tested proof commit for the composition
        env:
          # 4C-57: the composition's module now carries the dedicated
          # BuildKitd executable identity + process domain as STRUCTURE
