name: Release 2.4 P5-S2 Phase 4B live launcher/provisioning proof

# One-off investigation job (Phase 4B): the live Tumbleweed proof of the
# Phase 3 categorized provisioning and the Phase 4A launcher self-reexec
# chain under the SHIPPED policy, on the clean production composition (the
# binary, the module 1.2, the unit, and the provisioning script built from
# the tested proof commit; rootlesskit + the pinned bundled buildkitd). No
# guest allow-module, no policy or code change; a pre-boundary launcher
# blocker or a denied provisioning relabel is recorded and the phase
# stops. The Release GO stays closed.

on:
  workflow_dispatch:
  push:
    branches:
      - p3
    paths:
      - .github/workflows/release-2.4-p5s2-phase4b-launcher-tw.yml
      - scripts/release-2.4-p5s2-phase4b-launcher-tw.sh
      - scripts/release-2.4-p5s2-phase4b-launcher-tw-vm.sh

permissions:
  contents: read

jobs:
  phase4b-launcher-tumbleweed:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out the tested proof commit for the composition
        env:
          # 4C-57: the composition's module now carries the dedicated
          # BuildKitd executable identity + process domain as STRUCTURE
          # ONLY — the ZERO-AUTHORITY corrective/architecture phase. The
          # 4C-56 canonical run 37414244341's phase-end
          # NEXT-STARTUP-BOUNDARY was the payload exec's entry boundary at
          # the GENERIC distro label (rootlesskit_t:s0:c1 -> bin_t:s0:file
          # denied execute inside
          # execve(/usr/libexec/docker-helper/buildkit/buildkitd)); the
          # new types (docker_helper_buildkitd_exec_t, file_type +
          # exec_type; docker_helper_buildkitd_t, domain) with the EXACT
          # .fc entry on the canonical path (the manager constant
          # builderManagerBuildkitd = the RootlessKit argv target = the
          # package payload destination) move that SAME production exec
          # boundary onto the private identity, and the ONE pointed
          # type_transition records the routing map
          # (rootlesskit_t:s0:cX -> exec -> buildkitd_t:s0:cX). The 4C-60
          # phase grants the pointed process transition — the routing
          # declaration's own authority (process:transition=0x2, the
          # kernel classmap) — and NOTHING else: no
          # siginh/noatsecure/rlimitinh/dyntransition/setexec (the
          # conventional transition bundle is NOT copied), no process2
          # surface, no entrypoint, no execute_no_trans, no
          # capability/cap_userns, no range_transition — every next hook
          # is a separate live-evidence phase; an scontext=buildkitd_t
          # record is the STRONG acceptance shape (the transition
          # succeeded live), every buildkitd_t context must carry the
          # source operation's category, and the next live boundary owns
          # 4C-72 (the proof ref advances from the 4C-71-era pin to the
          # commit carrying that module; identical Go sources, so the
          # binary is the same program).
          #
          # 4C-73: the 4C-72 canonical run 37644134366 proved the shared
          # runtime-root dir search grant live (the OLD boundary GONE;
          # BUILDKITD-RUNTIME-TREE-CATEGORY-HANDOFF=OK — the first live
          # mediation against the categorized per-op runtime tree, the
          # own-category c1 -> c1 pair) and its own terminal record is
          # the genuine PRE-CLEANUP owner: buildkitd_t:s0:c1 ->
          # builder_runtime_t:s0:c1:dir requested=denied=0x10 (the
          # metadata hook) inside the failing sys_newfstatat(AT_FDCWD,
          # /run/docker-helper-builder/ops/op_9ee65..., flag: 0) whose
          # exit 515.987119 is the anchor, the first later enter
          # 515.987147 being the state-tree cleanup-zone boundary
          # itself. The 4C-73 grant is the NEW pair/plane H rule allow
          # docker_helper_buildkitd_t docker_helper_builder_runtime_t:dir
          # getattr (the BARE singleton; decode(tclass=dir, 0x10) =
          # exactly { getattr }; dir:getattr is a METADATA hook — the
          # traversal/entry/mutation surfaces and the file/sock_file
          # classes stay their own live-evidence phases, no
          # socket/connect), the FIRST builder_runtime_t authority of
          # the buildkitd domain; the module-borne buildkitd-named allow
          # total moves 7 -> EXACTLY EIGHT, and the next live boundary
          # owns 4C-74 (the proof ref advances from the 4C-72-era pin to
          # the commit carrying that module; identical Go sources, so
          # the binary is the same program).
          #
          # 4C-74: the 4C-73 canonical run 37660355610 proved the
          # categorized runtime-tree dir getattr grant live (the OLD
          # boundary GONE; both per-op runtime-tree newfstatat lookups
          # passed CLEAN — ret 0x0 twice, zero in-window decisions — and
          # the runtime-tree category handoff c1 -> c1 held) and its own
          # terminal record is the genuine PRE-CLEANUP owner:
          # buildkitd_t:s0:c1 -> builder_runtime_t:s0:c1:dir
          # requested=denied=0x20000000 (the path-walk search hook)
          # inside the failing stale-socket-removal
          # sys_unlinkat(AT_FDCWD, /run/docker-helper-builder/ops/
          # op_feaa..., flag: 0) whose exit 547.066700 is the anchor —
          # the runtime's own pre-bind cleanup, NOT the post-failure
          # state-tree teardown whose ZONE2 boundary began only later at
          # 547.066726. The 4C-74 grant WIDENS THAT SAME RULE IN PLACE
          # (ONE rule, never split): allow
          # docker_helper_buildkitd_t docker_helper_builder_runtime_t:dir
          # { getattr search } — the delta exactly +search
          # (decode(tclass=dir, 0x20000000) = exactly { search }, the
          # standing kernel-side dir-class pin the 4C-64/66/72 search
          # grants live-proved; requested==denied so no subtraction of
          # standing bits is needed; dir:search is NOT an unlink bundle —
          # write/remove_name and the socket object's own sock_file:
          # unlink stay their own live-evidence phases, no sock_file
          # access, no socket/connect), the module-borne buildkitd-named
          # allow total STAYS EXACTLY EIGHT, and the next live boundary
          # owns 4C-75 (the proof ref advances from the 4C-73-era pin to
          # the commit carrying that module; identical Go sources, so
          # the binary is the same program).
          # 4C-75: the 4C-74 correction-1 canonical run 37683155675 proved
          # the categorized runtime-tree dir search grant live (the OLD
          # boundary GONE; both per-op runtime-tree newfstatat lookups
          # passed CLEAN, the stale-socket removal unlinkat PASSED WHOLE
          # (-ENOENT, zero in-window decisions), the runtime-tree category
          # handoff c1 -> c1 held, NO-PREANCHOR-POST=PASS under the
          # corrected causal machinery) and its own terminal record is
          # the genuine PRE-CLEANUP owner: buildkitd_t:s0:c1 ->
          # builder_runtime_t:s0:c1:dir requested=0x20000004 denied=0x4
          # (the AF_UNIX bind attempt's dir WRITE hook, trace-ts=
          # 543.896475, the UNTRACED-OWNER second-tier anchor — the
          # sys_bind enter/exit records were not traced; the
          # sysctl_net_t:dir search denial at 543.896448 before it stayed
          # HANDLED/NON-TERMINAL with the continuation proof
          # by=543.896475 untraced-owner-decision; only close(fd: 8)/
          # close(fd: 5), the ZONE2 state-tree teardown and the
          # error-report write+exit_group(1) followed). The 4C-75 grant
          # WIDENS THAT SAME RULE IN PLACE (ONE rule, never split):
          # allow docker_helper_buildkitd_t
          # docker_helper_builder_runtime_t:dir { getattr search write }
          # — the delta exactly +write (candidate = decode(denied) =
          # exactly { write }, NEVER the whole requested mask; dir:write
          # is NOT an unlink/creation bundle — add_name/remove_name/
          # create and the socket object's own sock_file hooks stay
          # their own live-evidence phases, never combined; no sock_file
          # access, no socket/connect), the module-borne buildkitd-named
          # allow total STAYS EXACTLY EIGHT, the 4C-75 harness arms
          # sys_enter_bind/sys_exit_bind (+ sys_exit_socket) so the
          # bind(2) owning window and the socket->fd->bind identity
          # chain are captured — instrumentation only, no policy
          # authority — and the next live boundary owns 4C-76 (the proof
          # ref advances from the 4C-74-era pin to the commit carrying
          # that module; identical Go sources, so the binary is the same
          # program).
          #
          # 4C-76: the 4C-75 canonical run 37997013594 proved the
          # categorized runtime-tree dir add_name grant live (the OLD
          # boundary GONE; the 4C-75 write took effect with zero
          # runtime-tree write denials in the span, the §11
          # BIND-FD-IDENTITY chain proven from the same trace — the
          # socket exit returned 0x8 and the bind record's fd field is
          # 8 — and NO-PREANCHOR-POST=PASS under the corrected causal
          # machinery) and its own terminal record is the genuine
          # PRE-CLEANUP owner: buildkitd_t:s0:c1 ->
          # builder_runtime_t:s0:c1:dir requested=0x24000000
          # denied=0x4000000 (the AF_UNIX socket-path creation's dir
          # add_name hook INSIDE the traced sys_bind window,
          # trace-ts=429.646505, 9us before the bind exit anchor
          # 429.646514 — the sys_bind enter/exit records WERE traced
          # this run; only the failure response followed). The 4C-76
          # grant WIDENS THAT SAME RULE IN PLACE (ONE rule, never
          # split): allow docker_helper_buildkitd_t
          # docker_helper_builder_runtime_t:dir { getattr search write
          # add_name } — the delta exactly +add_name (candidate =
          # decode(tclass=dir, denied=0x4000000) = exactly { add_name },
          # NEVER the whole requested mask 0x24000000={ search add_name
          # } — the standing search bit is not re-granted; dir:add_name
          # is NOT a creation bundle — NOT create (the inode-make
          # hook), NOT remove_name/unlink/rmdir (the removal hooks),
          # NOT setattr/mounton, and the socket object's own
          # sock_file:create/sock_file:write hooks stay their own
          # live-evidence phases, never combined; no sock_file access,
          # no socket/connect), the module-borne buildkitd-named allow
          # total STAYS EXACTLY EIGHT, the 4C-76 harness keeps the
          # bind(2) arming and the §10/§11 instruments (instrumentation
          # only, no policy authority), and the §19 alternate applies:
          # if the bind finally succeeded and the lifetime held, the
          # startup staircase STOPS and the cross-operation isolation
          # proof (4C-37) resumes — no artificial 4C-77 (the proof ref
          # advances from the 4C-75-era pin to the commit carrying that
          # module; identical Go sources, so the binary is the same
          # program).
          #
          # 4C-77: the 4C-76 canonical run 38027012897 proved the
          # categorized runtime-tree dir add_name grant live (the OLD
          # boundary GONE with zero runtime-tree add_name denials in the
          # span) and its own terminal record is the genuine PRE-CLEANUP
          # owner: buildkitd_t:s0:c1 -> builder_runtime_t:s0:c1:sock_file
          # requested=0x8 denied=0x8 audited=0x8 (the AF_UNIX socket
          # object's OWN inode-creation hook INSIDE the traced sys_bind
          # window, trace-ts=552.895275, AFTER the granted dir
          # search/write/add_name hooks had all passed silently in the
          # same bind, 17us before the bind exit anchor 552.895292 with
          # its own TRACED owning window; only the failure response
          # followed). THE CLASS MATTERS (the task correction withdrew
          # the dir-quintuple misread): the authority is the PAIR
          # (tclass=sock_file, 0x8) — the same bit number on the dir
          # class is dir:create and on the file class file:create and
          # NEITHER is this authority; candidate = decode(tclass=sock_file,
          # denied=0x8) = exactly { create }, requested==denied so no
          # subtraction of standing bits is needed. The 4C-77 grant is a
          # NEW pair+class plane (PLANE I), NEVER a widening of the dir
          # rule: allow docker_helper_buildkitd_t
          # docker_helper_builder_runtime_t:sock_file create — the FIRST
          # builder_runtime_t sock_file authority of the buildkitd
          # domain; NOT a writable-socket bundle (no
          # write/open/getattr/setattr/unlink/rename/append/lock/map
          # rides — the socket object's post-create USE stays its own
          # live-evidence phase), NOT the daemon transport (the
          # docker_helper_t { getattr open read write } rule is a
          # DIFFERENT subject and a DIFFERENT owner, never merged), the
          # manager/init provisioning surfaces byte-unchanged, no
          # socket/connect process surface; the module-borne
          # buildkitd-named allow total moves 8 -> EXACTLY NINE (the
          # 4C-69 NEW-plane precedent: a new pair+class is a new plane,
          # never a ninth widening — any TENTH rule trips), and the §19
          # alternate applies: if the bind finally succeeded and the
          # lifetime held, the startup staircase STOPS and the
          # cross-operation isolation proof (4C-37) resumes — no
          # artificial 4C-78 (the proof ref advances from the 4C-76-era
          # pin to the commit carrying that module; identical Go
          # sources, so the binary is the same program).
          PHASE4B_PROOF_REF: '481201c82ee030319b68680da8bc12feb59bd909'
        run: |
          git fetch --no-tags origin "$PHASE4B_PROOF_REF"
          PROOF_REF="$(git rev-parse "$PHASE4B_PROOF_REF^{commit}")"
          echo "proof ref: $PROOF_REF"
          git worktree add "$GITHUB_WORKSPACE/proof-src" "$PROOF_REF"
          echo "$PROOF_REF" > "$GITHUB_WORKSPACE/proof-src/.phase4b-proof-ref"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: proof-src/go.mod

      - name: Build the production binary from the tested proof commit
        run: (cd proof-src && go build -o docker-helper .)

      - name: Build the 4C-34 negative-command probe (static, from the script commit)
        run: cc -O2 -static -o tun-command-probe scripts/tun-command-probe.c

      - name: Build the 4C-37 cross-operation vehicle (static, from the script commit)
        run: cc -O2 -static -o tun-cross-op-vehicle scripts/tun-cross-op-vehicle.c

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Run the Phase 4B Tumbleweed launcher/provisioning proof
        run: |
          UAT_REPO_DIR="${{ github.workspace }}" \
          PHASE4B_PROOF_SRC="${{ github.workspace }}/proof-src" \
          PHASE4B_HELPER_BIN="${{ github.workspace }}/proof-src/docker-helper" \
          PHASE4B_TUN_PROBE_BIN="${{ github.workspace }}/tun-command-probe" \
          PHASE4B_CROSS_VEHICLE_BIN="${{ github.workspace }}/tun-cross-op-vehicle" \
          PHASE4B_EVIDENCE_DIR="$RUNNER_TEMP/release-2.4-p5s2-phase4b-launcher-evidence" \
            scripts/release-2.4-p5s2-phase4b-launcher-tw-vm.sh

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.4-p5s2-phase4b-launcher-tw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-2.4-p5s2-phase4b-launcher-evidence
          if-no-files-found: warn
