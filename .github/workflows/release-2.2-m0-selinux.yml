name: Release 2.2 M0-S SELinux proof

on:
  workflow_dispatch:
  push:
    branches:
      - release/2.2
    paths:
      - .github/workflows/release-2.2-m0-selinux.yml
      - scripts/release-2.2-m0-selinux-proof.sh
      - scripts/release-2.2-m0-selinux-vm.sh
      - scripts/uat-vm-opensuse-selinux-lib.sh
      - scripts/uat-vm-tumbleweed.sh
      - scripts/uat-opensuse-repo.sh
      - packaging/selinux/docker-helper.te
      - packaging/selinux/docker-helper.fc
      - build-selinux-policy.sh

permissions:
  contents: read

jobs:
  proof-static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate proof scripts and SELinux policy
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck checkpolicy semodule-utils
          bash -n scripts/release-2.2-m0-selinux-proof.sh
          bash -n scripts/release-2.2-m0-selinux-vm.sh
          shellcheck scripts/release-2.2-m0-selinux-proof.sh
          shellcheck scripts/release-2.2-m0-selinux-vm.sh
          scripts/check-selinux-policy.sh
          git diff --check

  selinux-workload-mode-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Run M0-S in enforcing Tumbleweed VM
        run: |
          UAT_REPO_DIR="${{ github.workspace }}" \
          M0_EVIDENCE_DIR="$RUNNER_TEMP/release-2.2-m0-selinux-evidence" \
            scripts/release-2.2-m0-selinux-vm.sh

      - name: Upload M0-S evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.2-m0-selinux-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-2.2-m0-selinux-evidence
          if-no-files-found: error
