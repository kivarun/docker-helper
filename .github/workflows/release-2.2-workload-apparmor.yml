name: Release 2.2 workload MAC AppArmor live proof

on:
  workflow_dispatch:
  push:
    branches:
      - feature/2.2.6-mac-workload-projection
    paths:
      - .github/workflows/release-2.2-workload-apparmor.yml
      - workload_live_proof_test.go
      - workload_apparmor.go
      - workload_mac.go
      - run_cleanup.go

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Validate repository
        run: |
          test -z "$(gofmt -l .)"
          go test ./...
          go test -race ./...
          go vet ./...
          git diff --check

  apparmor-live-workload-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install live-proof dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y apparmor apparmor-utils

      - name: Run production AppArmor workload MAC live proof
        run: |
          sudo -E env "PATH=$PATH" \
            DOCKER_HELPER_LIVE_WORKLOAD_PROOF=1 \
            WORKLOAD_EVIDENCE_DIR="$RUNNER_TEMP/release-2.2-workload-apparmor-evidence" \
            go test -c -o "$RUNNER_TEMP/workload-live-proof.test" .
          sudo -E env "PATH=$PATH" \
            scripts/release-2.2-live-proof-runner.sh \
            --binary "$RUNNER_TEMP/workload-live-proof.test" \
            -run 'TestLiveWorkloadAppArmor' \
            --evidence "$RUNNER_TEMP/release-2.2-workload-apparmor-evidence" \
            apparmor-denial.txt apparmor-summary.txt \
            apparmor-regular-file-denial.txt apparmor-regular-file-summary.txt \
            apparmor-nested-rw-denial.txt apparmor-nested-rw-summary.txt \
            apparmor-prefix-collision-denial.txt apparmor-prefix-collision-summary.txt

      - name: Upload live proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.2-workload-apparmor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-2.2-workload-apparmor-evidence
          if-no-files-found: error
