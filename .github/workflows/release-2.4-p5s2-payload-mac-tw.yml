name: Release 2.4 P5-S2 buildkit payload MAC experiment

# One-off investigation job (P5-S2g28): with the REAL production
# composition (the real builder manager under its real systemd unit with
# the SELinuxContext binding and the active unit-cgroup boundary, the
# manager's real rootlesskit launch vehicle with the production argv, and
# the pinned BuildKit payload), establish the minimal guest-only
# candidate payload MAC surface under SELinux Enforcing, via the G-series
# permissive-harvest method: first the exact enforcing baseline of the
# current production flow stop, then the full-path harvest
# (manager -> rootlesskit -> buildkitd -> readiness -> a real minimal
# HTTPS build) whose AVC records are the grant-ledger source. G28 does
# NOT measure cache poisoning, does NOT commit production policy, does
# NOT change manager/BuildKit/docker-helper sources.

on:
  workflow_dispatch:
  push:
    branches:
      - p3
    paths:
      - .github/workflows/release-2.4-p5s2-payload-mac-tw.yml
      - scripts/release-2.4-p5s2-payload-mac-tw.sh
      - scripts/release-2.4-p5s2-payload-mac-tw-vm.sh
      - packaging/selinux/docker-helper.te
      - packaging/selinux/docker-helper.fc
      - builder_manager.go

permissions:
  contents: read

jobs:
  payload-mac-tumbleweed:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod

      - name: Build the real docker-helper binary from the proof commit
        run: go build -o docker-helper .

      - name: Install QEMU and cloud-image tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils genisoimage

      - name: Run Tumbleweed payload MAC experiment
        run: |
          UAT_REPO_DIR="${{ github.workspace }}" \
          PAYLOAD_MAC_EVIDENCE_DIR="$RUNNER_TEMP/release-2.4-p5s2-payload-mac-evidence" \
            scripts/release-2.4-p5s2-payload-mac-tw-vm.sh

      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-2.4-p5s2-payload-mac-tw-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-2.4-p5s2-payload-mac-evidence
          if-no-files-found: warn
